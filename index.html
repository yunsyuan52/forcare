<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍維修記帳系統 (防 503 重試版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 15px; background-color: #f8f9fa; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .api-config { display: flex; gap: 10px; align-items: center; background: #e0f2fe; padding: 12px; border-radius: 6px; margin-bottom: 15px; flex-wrap: wrap; }
        .api-config input { flex: 1; min-width: 200px; padding: 8px; border: 1px solid #bae6fd; border-radius: 4px; }
        .upload-section { display: flex; flex-direction: column; align-items: center; gap: 12px; border: 2px dashed #cbd5e1; padding: 25px; border-radius: 8px; background: #f1f5f9; }
        input[type="file"] { display: none; }
        .btn { background-color: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #1d4ed8; }
        .btn-ai { background-color: #059669; }
        .btn-ai:hover { background-color: #047857; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background-color: #f1f5f9; }
        .status-paid { color: #16a34a; font-weight: bold; }
        .status-unpaid { color: #dc2626; font-weight: bold; }
        .action-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .loading { display: none; color: #2563eb; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>宿舍設備維修記帳</h1>

    <div class="card">
        <div class="api-config">
            <label><b>Gemini API Key：</b></label>
            <input type="password" id="apiKeyInput" placeholder="請貼上你的 API Key">
            <button class="btn" onclick="saveApiKey()">儲存 Key</button>
        </div>

        <div class="upload-section">
            <label for="fileInput" class="btn">📷 選擇或拍攝請款單照片</label>
            <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="previewImage(event)">
            
            <img id="preview" style="max-width: 300px; display: none; border-radius: 6px; border: 1px solid #ccc;">
            
            <button id="aiBtn" class="btn btn-ai" style="display: none;" onclick="processImageWithAI()">🤖 開始 AI 辨識並自動新增筆數</button>
            <div id="loadingText" class="loading">⏳ AI 辨識中，請稍候...</div>
        </div>
    </div>

    <div class="card">
        <h3>記帳明細清單</h3>
        <table>
            <thead>
                <tr>
                    <th>宿舍名稱</th>
                    <th>品項</th>
                    <th>金額</th>
                    <th>狀態</th>
                    <th>備註/日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordsTable"></tbody>
        </table>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem("dormAccountingRecords")) || [];
        let currentBase64Image = "";

        document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (!key) {
                alert("請輸入有效的 API Key！");
                return;
            }
            localStorage.setItem("gemini_api_key", key);
            alert("API Key 已成功儲存！");
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentBase64Image = e.target.result;
                const img = document.getElementById("preview");
                img.src = currentBase64Image;
                img.style.display = "block";
                document.getElementById("aiBtn").style.display = "inline-block";
            };
            reader.readAsDataURL(file);
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function processImageWithAI() {
            const apiKey = localStorage.getItem("gemini_api_key");
            if (!apiKey) {
                alert("請先在上方輸入並儲存你的 Gemini API Key！");
                return;
            }

            const loadingElem = document.getElementById("loadingText");
            loadingElem.style.display = "block";
            document.getElementById("aiBtn").disabled = true;

            const base64Parts = currentBase64Image.split(',');
            const mimeType = base64Parts[0].match(/:(.*?);/)[1] || "image/jpeg";
            const base64Data = base64Parts[1];

            const prompt = `你是一個專業的記帳助手。請分析這張宿舍設備維修請款單照片，擷取表格中的所有費用項目數據。
請直接回傳純 JSON 格式陣列，不要包含任何 Markdown 標記（不要寫 \`\`\`json）：
[
  {
    "dorm": "宿舍名稱或雇主別",
    "item": "維修/換新項目",
    "amount": 數字金額,
    "note": "損壞狀況或原因 (請款日期)"
  }
]`;

            const models = ["gemini-3.6-flash", "gemini-2.5-flash", "gemini-1.5-flash"];
            let success = false;
            let lastError = "";

            for (const model of models) {
                if (success) break;
                const endpoint = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${apiKey}`;

                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        loadingElem.innerText = `⏳ AI 辨識中 (${model} 嘗試第 ${attempt} 次)...`;
                        
                        const response = await fetch(endpoint, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: prompt },
                                        { inline_data: { mime_type: mimeType, data: base64Data } }
                                    ]
                                }]
                            })
                        });

                        const data = await response.json();

                        if (response.status === 503) {
                            lastError = "伺服器忙碌 (503)";
                            await delay(2000 * attempt);
                            continue;
                        }

                        if (data.error) {
                            throw new Error(`(${data.error.code}) ${data.error.message}`);
                        }

                        let text = data.candidates[0].content.parts[0].text.trim();
                        text = text.replace(/```json/g, "").replace(/```/g, "").trim();

                        const parsedItems = JSON.parse(text);

                        parsedItems.forEach(item => {
                            records.unshift({
                                id: Date.now() + Math.random(),
                                dorm: item.dorm || "未知宿舍",
                                item: item.item || "未知名目",
                                amount: Number(item.amount) || 0,
                                paid: false,
                                note: item.note || ""
                            });
                        });

                        localStorage.setItem("dormAccountingRecords", JSON.stringify(records));
                        renderTable();
                        alert(`🎉 辨識成功！自動新增了 ${parsedItems.length} 筆帳目！`);
                        success = true;
                        break;

                    } catch (err) {
                        console.warn(`[${model}] 請求失敗:`, err);
                        lastError = err.message;
                        if (!err.message.includes("503")) break;
                    }
                }
            }

            if (!success) {
                alert(`辨識失敗：伺服器繁忙或無回應，請稍後重試。\n詳細錯誤：${lastError}`);
            }

            loadingElem.innerText = "⏳ AI 辨識中，請稍候...";
            loadingElem.style.display = "none";
            document.getElementById("aiBtn").disabled = false;
        }

        function renderTable() {
            const tbody = document.getElementById("recordsTable");
            tbody.innerHTML = "";
            records.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><b>${item.dorm}</b></td>
                    <td>${item.item}</td>
                    <td>NT$ ${item.amount.toLocaleString()}</td>
                    <td><span class="${item.paid ? 'status-paid' : 'status-unpaid'}">${item.paid ? '已付' : '未付'}</span></td>
                    <td>${item.note}</td>
                    <td><button class="action-btn" onclick="deleteRecord('${item.id}')">刪除</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteRecord(id) {
            records = records.filter(r => String(r.id) !== String(id));
            localStorage.setItem("dormAccountingRecords", JSON.stringify(records));
            renderTable();
        }

        renderTable();
    </script>
</body>
</html>
